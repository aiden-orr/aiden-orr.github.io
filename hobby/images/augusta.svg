
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#9fd3ef"></stop>
      <stop offset="1" stop-color="#e8f1cb"></stop>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#527d60"></stop>
      <stop offset="1" stop-color="#253f3b"></stop>
    </linearGradient>
    <linearGradient id="green" x2="0" y2="1">
      <stop stop-color="#b7d87a"></stop>
      <stop offset="1" stop-color="#4c8c43"></stop>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="900" height="600" fill="url(#sky)"></rect>

  <!-- Forest -->
  <path d="M0 310V80Q90 20 165 95T310 75T470 100T640 65T900 85V310Z" fill="#315d3d"></path>
  <path d="M0 335Q180 215 370 295T710 245T900 275V410H0Z" fill="#568b48"></path>

  <!-- Trees -->
  <g fill="#477c3e">
    <circle cx="80" cy="155" r="95"></circle>
    <circle cx="220" cy="130" r="105"></circle>
    <circle cx="370" cy="155" r="85"></circle>
    <circle cx="570" cy="125" r="110"></circle>
    <circle cx="785" cy="135" r="115"></circle>
  </g>

  <!-- Golf green -->
  <path d="M0 355Q280 270 530 340T900 310V430H0Z" fill="url(#green)"></path>
  <path d="M200 365Q420 300 650 350T900 355" fill="none" stroke="#d7e79a" stroke-width="12"></path>

  <!-- Sand bunkers -->
  <path d="M365 337Q415 313 455 340Q425 363 365 337Z" fill="#f7ebcb"></path>
  <path d="M550 347Q610 322 670 353Q615 377 550 347Z" fill="#f7ebcb"></path>

  <!-- Flag -->
  <path d="M510 275V350" stroke="#f9f3dd" stroke-width="4"></path>
  <path d="M512 275L555 289L512 305Z" fill="#c64632"></path>

  <!-- Rae's Creek -->
  <path d="M0 395Q230 355 470 400T900 380V600H0Z" fill="url(#water)"></path>
  <path d="M0 435Q250 405 470 442T900 420" fill="none" stroke="#91b9a2" stroke-width="5" opacity=".55"></path>

  <!-- Stone bridge with three arches -->
  <path d="M25 385Q345 355 720 455L785 515
           Q430 415 0 450Z" fill="#b9ac8d" stroke="#776e60" stroke-width="5"></path>

  <g fill="#294c42">
    <path d="M50 450Q95 390 145 463Z"></path>
    <path d="M180 460Q235 390 295 475Z"></path>
    <path d="M340 480Q405 415 475 500Z"></path>
  </g>

  <path d="M25 385Q345 355 720 455" fill="none" stroke="#eee0bb" stroke-width="9"></path>

  <!-- Azalea flowers -->
  <g fill="#dd4e8a">
    <circle cx="60" cy="505" r="24"></circle>
    <circle cx="100" cy="525" r="29"></circle>
    <circle cx="145" cy="505" r="23"></circle>
    <circle cx="195" cy="550" r="31"></circle>
    <circle cx="270" cy="570" r="25"></circle>
    <circle cx="780" cy="340" r="22"></circle>
    <circle cx="825" cy="325" r="25"></circle>
    <circle cx="865" cy="350" r="23"></circle>
  </g>

  <g fill="#f3a2c5">
    <circle cx="78" cy="490" r="11"></circle>
    <circle cx="125" cy="515" r="12"></circle>
    <circle cx="185" cy="535" r="13"></circle>
    <circle cx="248" cy="565" r="12"></circle>
    <circle cx="800" cy="325" r="10"></circle>
    <circle cx="845" cy="342" r="11"></circle>
  </g>
</svg>
